version: "3.8"

services:
  fitness-app:
    image: 3bok/fitness-app:latest
    container_name: fitness-app
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3013:3013"
    volumes:
      - fitness-db:/app/db
    environment:
      - NODE_ENV=production
      - PORT=3013
      - HOSTNAME=0.0.0.0
      # Auth Configuration
      - BETTER_AUTH_SECRET=your_secret_key_here
      - NEXT_PUBLIC_BETTER_AUTH_URL=https://fitness.truyens.pro
      - NEXT_PUBLIC_APP_URL=https://fitness.truyens.pro
      # OAuth Providers (Replace with your keys)
      - GOOGLE_CLIENT_ID=your_google_client_id
      - GOOGLE_CLIENT_SECRET=your_google_client_secret
      - GITHUB_CLIENT_ID=your_github_client_id
      - GITHUB_CLIENT_SECRET=your_github_client_secret
    networks:
      - staging-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3013",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fitness-db:
    driver: local

networks:
  staging-network:
    external: true
