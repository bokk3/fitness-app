version: '3.8'

services:
  fitness-app:
    image: ${DOCKERHUB_USERNAME}/fitness-app:latest
    container_name: fitness-app
    ports:
      - "3000:3000"
    volumes:
      - fitness-db:/app/db
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fitness-db:
    driver: local
